"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "$directory$os$git_branch$git_status$rust$golang$php$fill$status$cmd_duration$terraform$kubernetes$time\n$sudo$character"

[fill]
symbol = " "

[time]
disabled    = false
format      = "[$time](bold white)"
time_format = "%H:%M:%S"

[cmd_duration]
min_time = 2000
format   = "[󰔛 $duration](bold yellow) "

[directory]
format            = "[$path](cyan) "
truncation_length = 0
truncate_to_repo  = false

[git_branch]
symbol = ""
format = "[$symbol $branch](bold purple) "

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold cyan)"
behind     = "[⇣$count ](bold cyan)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged     = "[+$count ](bold green)"
modified   = "[●$count ](bold yellow)"
untracked  = "[?$count ](bold white)"
deleted    = "[✘$count ](bold red)"
conflicted = "[⚡$count ](bold red)"

[rust]
symbol = ""
format = "[$symbol $version](red) "

[golang]
symbol = ""
format = "[$symbol $version](cyan) "

[php]
symbol = ""
format = "[$symbol $version](purple) "

[kubernetes]
disabled = false
# Only shown after a kubectl command (STARSHIP_KUBE is set by a preexec hook in prompt.zsh)
detect_env_vars = ["STARSHIP_KUBE"]
symbol   = "󱃾"
format   = "[$symbol $context( \\($namespace\\))]($style) "
style    = "bold blue"

[[kubernetes.contexts]]
context_pattern = "^z-.*"
style           = "bold red"

[[kubernetes.contexts]]
context_pattern = "^teleport.*"
style           = "bold yellow"

[terraform]
symbol = "󱁢"
format = "[$symbol $workspace](purple) "

[sudo]
disabled = false
symbol   = "󰌋"
format   = "[$symbol]($style) "
style    = "bold yellow"

[status]
disabled = false
symbol   = "✘"
format   = "[$symbol $status]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol   = "[❯](red)"
vimcmd_symbol  = "[❮](blue)"
